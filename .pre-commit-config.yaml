# Hooks nutzen die gepinnten Versionen aus requirements-dev.txt (language: system),
# damit pre-commit, CI und `make verify` identisch prüfen.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: no-env-files
        name: keine .env-Dateien committen
        entry: .env darf nicht committet werden
        language: fail
        files: (^|/)\.env$
      - id: no-private-keys
        name: keine privaten Schlüssel committen
        entry: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
        language: pygrep
