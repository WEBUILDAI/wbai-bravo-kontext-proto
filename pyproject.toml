[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''/(\.venv|venv)/'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "S", "T20", "SIM"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["bravo_infra", "bravo_kontext"]

[tool.pytest.ini_options]
testpaths = ["infra/tests", "server/tests"]
pythonpath = ["infra", "server"]
addopts = "-q"
